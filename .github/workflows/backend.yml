name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docs/CONTRACT.md"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docs/CONTRACT.md"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run pytest
        env:
          # Never provide a real key. Tests mock xAI and must pass without one.
          XAI_API_KEY: ""
        run: pytest -ra
